<!DOCTYPE html>

<html>
<head>
	<link rel="stylesheet" href="styles.css">
	<title>Job Application Form</title>
</head>

<body>
	<!-- the entire body must be written by student -->
	<form method="post">
		<label for="name">Name</label>
		<input type="text" id="name" required name="name">
		<br>
		<label for="email">Email</label>
		<input type="email" id="email" required name="email">
		<br>
		<label for="gender">Gender</label>
		<input type="radio" name="gender" required value="Male">Male
		<input type="radio" name="gender" required value="female">Female
		<br>
		<label for="laptop">Laptop Brands</label>
		<select id="laptop" name="laptop">
			<option value="Apple">Apple</option>
			<option value="Asus">Asus</option>
			<option value="HP">HP</option>
		</select>
		<br>
		<label for="age">Age</label>
		<input type="number" id="age" required name="age">
		<br>
		<label for="dob">Date of Birth</label>
		<input type="date" id="dob" required name="dob">
		<br>
		<label for="password">Password</label>
		<input type="password" id="password" required name="password">
		<br>
		<label for="portfolio">Portfolio URL</label>
		<input type="url" id="portfolio" name="portfolio">
		<br>
		<button type="submit">Submit</button>
	</form>
    <script type="text/javascript" src="./script.js">
</script>
</body>

</html>
